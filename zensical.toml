[project]
site_name = "The Control Plane"
# Absolute URL of the published site: og:image needs it (LinkedIn wants absolute HTTPS).
site_url = "https://www.example.com/"
docs_dir = "docs"
site_dir = "site"
# links.css: site icons before external links; layout.css: card grid columns, no scrollbar gutter.
extra_css = ["assets/stylesheets/links.css", "assets/stylesheets/layout.css"]
nav = [
  "index.md",
  { "AI lab" = [
    "ai-lab/index.md",
    "ai-lab/01-intro.md",
    "ai-lab/02-slurm.md",
    "ai-lab/03-kubernetes.md",
    "ai-lab/04-bmc-redfish.md",
    "ai-lab/05-nvlink.md",
    "ai-lab/06-observability.md",
    "ai-lab/07-networking.md",
  ] },
]

[project.theme]
language = "en"
# overrides/main.html: Open Graph tags from each page's front-matter `image`.
custom_dir = "overrides"
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
