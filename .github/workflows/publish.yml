name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Same Zola as the local .bin/zola; the checksum is GitHub's recorded digest
  # of the release asset.
  ZOLA_VERSION: 0.23.6
  ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # themes/tabi, pinned to v5.0.0

      - name: Install Zola
        run: |
          archive="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/${archive}"
          echo "${ZOLA_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin zola
          zola --version

      # Social cards and the diagram are committed; CI only builds the site.
      - name: Build
        run: zola build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
