# Absolute URL of the published site: og:image needs it (LinkedIn wants absolute HTTPS).
base_url = "https://blog.emelianov.cloud"
title = "The Control Plane"
description = "Notes on the infrastructure behind AI workloads, written for systems engineers."
default_language = "en"
theme = "tabi"
compile_sass = true
minify_html = true
build_search_index = true

[search]
include_title = true
include_description = true
include_content = true
index_format = "elasticlunr_json"

[markdown]
smart_punctuation = true

[markdown.highlighting]
theme = "catppuccin-frappe"
style = "class"

[extra]
# Article text in the sans-serif font the headings use (tabi defaults to serif).
override_serif_with_sans = true
theme_switcher = true
copy_button = true
toc = true
quick_navigation_buttons = true
show_reading_time = true
show_date = true
show_remote_changes = false
show_remote_source = false
# links.css: site icons before external links (GitHub, NVIDIA docs, linuxcontainers.org);
# layout.css: a wider page, line spacing, left-aligned tables, distinct h2/h3; colors.css: dimmed accent;
# code.css: console blocks with commands at full strength and output dimmed.
stylesheets = ["css/links.css", "css/layout.css", "css/colors.css", "css/code.css"]
# Default LinkedIn preview; posts set their own card in front matter.
social_media_card = "ai-lab/01-intro/card.png"
favicon_emoji = "🎛️"
# No header links (tabi's default menu lists demo sections). templates/partials/nav.html
# still draws search and the theme switcher with an empty menu.
menu = []

socials = [
    { name = "GitHub", url = "https://github.com/arkady-emelyanov/", icon = "github" },
    { name = "LinkedIn", url = "https://www.linkedin.com/in/arkadii-emelianov/", icon = "linkedin" },
]
