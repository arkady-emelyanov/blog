# Absolute URL of the published site: og:image needs it (LinkedIn wants absolute HTTPS).
base_url = "https://blog.emelianov.cloud"
title = "The Control Plane"
description = "Notes on the infrastructure behind AI workloads, written for systems engineers."
default_language = "en"
theme = "tabi"
compile_sass = true
minify_html = true
build_search_index = true

[search]
include_title = true
include_description = true
include_content = true
index_format = "elasticlunr_json"

[markdown]
smart_punctuation = true

[markdown.highlighting]
theme = "catppuccin-frappe"
style = "class"

[extra]
# Article text in the sans-serif font the headings use (tabi defaults to serif).
override_serif_with_sans = true
# Dark only, like the rest of emelianov.cloud (static/css/space.css).
theme_switcher = false
default_theme = "dark"
copy_button = true
toc = true
quick_navigation_buttons = true
show_reading_time = true
show_date = true
show_remote_changes = false
show_remote_source = false
# links.css: site icons before external links (GitHub, NVIDIA docs, linuxcontainers.org);
# layout.css: a wider page, line spacing, left-aligned tables, distinct h2/h3;
# space.css: the look of emelianov.cloud (deep-space background, thin sans, violet accent);
# code.css: console blocks with commands at full strength and output dimmed.
stylesheets = ["css/links.css", "css/layout.css", "css/space.css", "css/code.css"]
# Default LinkedIn preview; posts set their own card in front matter.
social_media_card = "ai-lab/01-intro/card.png"
favicon_emoji = "🎛️"
# No header links (tabi's default menu lists demo sections). templates/partials/nav.html
# still draws search with an empty menu.
menu = []

socials = [
    { name = "GitHub", url = "https://github.com/arkady-emelyanov/", icon = "github" },
    { name = "LinkedIn", url = "https://www.linkedin.com/in/arkadii-emelianov/", icon = "linkedin" },
]

# Self-hosted GoatCounter (shared with the apex site, so paths are prefixed with the
# blog's hostname). The service name isn't one tabi knows, so tabi only includes
# templates/partials/analytics.html, which draws the script, and adds nothing to the CSP.
[extra.analytics]
service = "goatcounter-beacon"
url = "https://beacon.emelianov.cloud/goatcounter"

# tabi's default CSP, plus the GoatCounter host in script-src and connect-src. Those two
# come first: tabi appends them at the end and would otherwise leave an empty directive.
[[extra.allowed_domains]]
directive = "script-src"
domains = ["https://beacon.emelianov.cloud"]

[[extra.allowed_domains]]
directive = "connect-src"
domains = ["https://beacon.emelianov.cloud"]

[[extra.allowed_domains]]
directive = "font-src"
domains = ["'self'", "data:"]

[[extra.allowed_domains]]
directive = "img-src"
domains = ["'self'", "https://*", "data:"]

[[extra.allowed_domains]]
directive = "media-src"
domains = ["'self'"]

[[extra.allowed_domains]]
directive = "style-src"
domains = ["'self'"]

[[extra.allowed_domains]]
directive = "frame-src"
domains = ["player.vimeo.com", "https://www.youtube-nocookie.com"]
