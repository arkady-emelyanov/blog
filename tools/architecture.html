<!DOCTYPE html>
<!-- Hand-drawn architecture diagram of the lab (part 1). Rendered to PNG by
     tools/render-diagram.py; rough.js and the Kalam font come from tools/vendor/. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Kalam; src: url(vendor/Kalam-Regular.ttf); }
  @font-face { font-family: Kalam; font-weight: bold; src: url(vendor/Kalam-Bold.ttf); }
  html, body { margin: 0; background: #fdfdfb; }
  svg text { font-family: Kalam, cursive; fill: #1e1e1e; }
  .title { font-size: 30px; font-weight: bold; }
  .line { font-size: 24px; }
  .label { font-size: 24px; fill: #555; }
</style>
<script src="vendor/rough.js"></script>
</head>
<body>
<svg id="d" width="1560" height="740" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const svg = document.getElementById("d");
const rc = rough.svg(svg);
const INK = "#1e1e1e";
const base = { seed: 7, roughness: 1.4, bowing: 1.2, stroke: INK, strokeWidth: 2 };
const add = node => svg.appendChild(node);

function box(x, y, w, h, fill) {
  add(rc.rectangle(x, y, w, h, { ...base, fill, fillStyle: "hachure", hachureGap: 9, fillWeight: 1.5 }));
}
function line(x1, y1, x2, y2, opts = {}) { add(rc.line(x1, y1, x2, y2, { ...base, ...opts })); }
function text(x, y, s, cls, anchor = "start") {
  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("x", x); t.setAttribute("y", y); t.setAttribute("class", cls);
  t.setAttribute("text-anchor", anchor); t.textContent = s; add(t);
}
function node(x, y, w, h, fill, title, lines) {
  box(x, y, w, h, fill);
  text(x + w / 2, y + 44, title, "title", "middle");
  lines.forEach((l, i) => text(x + w / 2, y + 84 + i * 32, l, "line", "middle"));
}

// Your machine and its link to the bridge.
node(470, 24, 620, 112, "#dbe9ff", "your machine", ["bin/ssh · bin/kubectl · bin/redfish · bin/grpcurl · browser"]);
line(780, 136, 780, 226);

// The Incus bridge: one management network for everything.
line(40, 236, 1520, 236, { strokeWidth: 5 });
line(40, 246, 1520, 246, { strokeWidth: 2 });
text(48, 218, "Incus bridge · management network", "label");

// The instances.
const W = 272, G = 26, Y = 320, H = 210;
const nodes = [
  ["#eeeeee", "sched-login", ["user shells"]],
  ["#ffe8cc", "sched-control", ["slurmctld or k3s,", "LDAP, Prometheus,", "Grafana, topograph"]],
  ["#eeeeee", "sched-storage", ["S3, JuiceFS", "metadata"]],
  ["#d3f9d8", "sched-worker1/2", ["GPU trays,", "4 × GB200 each"]],
  ["#d3f9d8", "sched-nvswitch", ["NVLink partition", "controller,", "fabric telemetry"]],
];
nodes.forEach(([fill, title, lines], i) => {
  const x = 40 + i * (W + G);
  line(x + W / 2, 246, x + W / 2, Y);
  if (title === "sched-worker1/2") box(x + 12, Y - 12, W, H, fill);   // two trays: a second box behind
  node(x, Y, W, H, fill, title, lines);
});

// BMCs, also on the bridge (out of band); dashed: the tray each one manages.
const BY = 640, BW = 220, BH = 70;
const bmcs = [["sched-worker1-bmc", 900, 1000], ["sched-worker2-bmc", 1140, 1150], ["sched-nvswitch-bmc", 1390, 1368]];
bmcs.forEach(([name, cx, from]) => {
  line(from, Y + H, cx, BY, { strokeLineDash: [8, 8] });
  box(cx - BW / 2, BY, BW, BH, "#fff3bf");
  text(cx, BY + 46, name, "line", "middle");
});
text(40, BY + 46, "BMCs (Redfish), on the same bridge  →", "label");
</script>
</body>
</html>
